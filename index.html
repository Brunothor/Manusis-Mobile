<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F37021">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Manusis Mobile (Demo Educacional)</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#d8d8d8;color:#333}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#f2f2f2;position:relative;box-shadow:0 0 24px rgba(0,0,0,.25);padding-bottom:64px}
.header{background:#F37021;color:#fff;display:flex;align-items:center;min-height:54px;padding:8px 10px;position:sticky;top:0;z-index:50}
.header .icon-btn{background:none;border:none;color:#fff;font-size:21px;padding:8px 9px;cursor:pointer;line-height:1}
.header h1{font-size:16.5px;font-weight:600;margin-left:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header img.logo{height:26px;flex:1;object-fit:contain;object-position:left;margin-left:10px}
.offline-badge{font-size:10px;background:#fff;color:#e53935;border-radius:4px;padding:2px 6px;font-weight:700;margin-right:4px}
.queue-badge{font-size:10px;background:#1e88e5;color:#fff;border-radius:8px;padding:2px 7px;margin-right:4px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#F37021;display:flex;z-index:60}
.bottom-nav button{flex:1;background:none;border:none;color:#fff;font-size:19px;padding:10px 0 9px;cursor:pointer;opacity:.85}
.bottom-nav button.active{opacity:1;background:rgba(255,255,255,.18)}
.content{padding:12px}
.card{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:14px;margin-bottom:12px}
.card h3{font-size:14px;color:#555;margin-bottom:10px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:12px;text-align:center}
.kpi .lb{font-size:11.5px;color:#777;min-height:28px;display:flex;align-items:center;justify-content:center}
.kpi .vl{font-size:23px;font-weight:700;color:#333;margin-top:4px}
.kpi .vl.orange{color:#F37021}
.search{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #F37021;color:#F37021;background:#fff;border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip.on{background:#F37021;color:#fff}
.list-item{background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.12);margin-bottom:9px;padding:11px 12px 11px 0;display:flex;align-items:center;cursor:pointer}
.list-item .bar{width:5px;align-self:stretch;border-radius:6px 0 0 6px;margin-right:11px;flex-shrink:0}
.li-main{flex:1;min-width:0}
.li-title{font-size:13.5px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11.5px;color:#888;margin-top:2px}
.li-tag{font-size:10.5px;font-weight:700;border-radius:3px;padding:2px 6px;color:#fff;flex-shrink:0}
.li-arrow{color:#bbb;font-size:16px;margin-left:8px;flex-shrink:0}
.fab{position:fixed;bottom:72px;right:calc(50% - 240px + 14px);max-width:464px;background:#F37021;color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:24px;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;z-index:55}
@media (max-width:480px){.fab{right:14px}}
.btn{background:#F37021;color:#fff;border:none;border-radius:4px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;text-transform:uppercase}
.btn.gray{background:#9e9e9e}
.btn.green{background:#43a047}
.btn.outline{background:#fff;color:#F37021;border:1px solid #F37021}
.btn-row{display:flex;gap:10px}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #eee;position:sticky;top:54px;z-index:40;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:11px 13px;font-size:12px;color:#777;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#F37021;border-bottom-color:#F37021;font-weight:700}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:4px;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:14px;background:#fff}
.fld input[readonly]{background:#eee;color:#666}
.fld-row{display:flex;gap:10px}
.fld-row .fld{flex:1}
.qr-ico{float:right;background:none;border:1px solid #F37021;color:#F37021;border-radius:4px;font-size:16px;padding:5px 9px;cursor:pointer;margin-left:6px}
.pend-opt{display:flex;align-items:center;gap:8px;margin-top:10px}
.pend-opt input[type=text]{flex:1;padding:9px;border:1px solid #ccc;border-radius:4px}
.act-btn{width:44px;height:36px;border:none;border-radius:4px;color:#fff;font-weight:700;cursor:pointer;font-size:13px}
.ok{background:#43a047}.nok{background:#e53935}.na{background:#9e9e9e}
.act-btn.on{outline:3px solid #ffca28}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{color:#555;font-weight:600}
.kv span{text-align:right;color:#333}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:80vw;background:#fff;z-index:81;transform:translateX(-100%);transition:transform .25s;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer .dhead{background:#F37021;color:#fff;padding:18px 16px}
.drawer .dhead .avatar{width:52px;height:52px;border-radius:50%;background:#fff;color:#F37021;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin-bottom:8px}
.drawer .dhead .nm{font-size:14px;font-weight:700}
.drawer .dhead .em{font-size:11.5px;opacity:.9}
.drawer .ditem{padding:13px 16px;font-size:13.5px;color:#444;border-bottom:1px solid #f2f2f2;cursor:pointer;display:flex;gap:10px;align-items:center}
.drawer .ditem.on{background:#fdeadd;color:#F37021;font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;opacity:0;transition:.3s;z-index:99;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px;background:linear-gradient(160deg,#f9772b,#e05e12)}
.center-screen .card{margin-bottom:14px}
.login-logo{display:block;margin:0 auto 22px;max-width:190px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.banner-img{width:100%;height:110px;object-fit:cover;border-radius:6px 6px 0 0}
.sync-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:14px}
.sync-bar div{height:100%;background:#F37021;width:0%;transition:width .3s}
.qr-box{width:220px;height:220px;margin:24px auto;border:3px solid #F37021;border-radius:12px;position:relative;overflow:hidden;background:#222}
.qr-line{position:absolute;left:8px;right:8px;height:3px;background:#43a047;box-shadow:0 0 10px #43a047;animation:scan 1.6s linear infinite}
@keyframes scan{0%{top:8px}50%{top:calc(100% - 11px)}100%{top:8px}}
.timer-pill{background:#1e88e5;color:#fff;border-radius:16px;padding:4px 12px;font-size:12.5px;font-weight:700;position:sticky;top:100px;z-index:30;display:flex;gap:10px;align-items:center;margin:0 12px}
.note{font-size:11px;color:#999;margin-top:6px}
h4.sec{font-size:12px;color:#F37021;text-transform:uppercase;margin:14px 0 8px;letter-spacing:.5px}
.empty{text-align:center;color:#aaa;padding:34px 10px;font-size:13px}
</style>
</head>

/* ---------- fila de sincronismo ---------- */
function queue(action){
  if(DB.online){toast('Sincronizado com o Manusis Web ✓');}
  else{DB.queue.push({t:Date.now(),...action});saveDB();toast('Off-line: ação na fila ('+DB.queue.length+')');updateBadges();}
}
function toggleOnline(){
  DB.online=!DB.online;saveDB();
  if(DB.online){drainQueue();}else{toast('Modo OFF-LINE ativado');}
  updateBadges();render();
}
function drainQueue(){
  const n=DB.queue.length;if(!n){return;}
  toast('Sincronizando '+n+' ação(ões)...');let i=0;
  const iv=setInterval(()=>{i++;if(i>=n){clearInterval(iv);DB.queue=[];saveDB();toast('Sincronismo concluído ✓');updateBadges();render();}},700);
}
function updateBadges(){
  const b=document.getElementById('queueBadge');
  if(b){ if(!DB.online&&DB.queue.length){b.style.display='';b.textContent=DB.queue.length;} else b.style.display='none';}
  const ob=document.getElementById('offBadge');if(ob)ob.style.display=DB.online?'none':'';
}
/* ---------- apontamento de tempo ---------- */
function restoreTimer(){TIMER=DB.timer||null;}
function timerStart(omNum,tipo){TIMER={om:omNum,tipo,start:Date.now()};DB.timer=TIMER;saveDB();startTicker();toast('Apontamento "'+tipo+'" iniciado');render();}
function timerStop(){if(!TIMER)return;const h=(Date.now()-TIMER.start)/3600000;
  const om=DB.oms.find(o=>o.num===TIMER.om);
  if(om)om.apont.push({mant:DB.user?DB.user.nome:USER_DEMO.nome,tipo:TIMER.tipo,ini:TIMER.start,fim:Date.now(),h:Math.round(h*100)/100});
  TIMER=null;DB.timer=null;saveDB();stopTicker();
  queue({t:'apont',om:om?om.num:''});toast('Apontamento registrado: '+fmtH(h));render();}
function startTicker(){stopTicker();TIMER_IV=setInterval(()=>{const e=document.getElementById('timerTxt');if(e&&TIMER)e.textContent=fmtH((Date.now()-TIMER.start)/3600000)+'h';},1000);}
function stopTicker(){if(TIMER_IV){clearInterval(TIMER_IV);TIMER_IV=null;}}
/* ---------- helpers ---------- */
function fmtH(n){return (n||0).toFixed(2).replace('.',',')+'h'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function nowBR(){const d=new Date();return d.toLocaleDateString('pt-BR')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function ativo(id){return DB.ativos.find(a=>a.id===id)||DB.ativos[0]}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350)},2700);}
/* ---------- roteador ---------- */
function go(r){location.hash=r}
function route(){const h=(location.hash||'#home').slice(1);const q=h.indexOf('?');return {r:q<0?h:h.slice(0,q),p:new URLSearchParams(q<0?'':h.slice(q+1))};}
function requireBoot(){
  const {r}=route();
  if(!DB.activated&&r!=='activate')return '#activate';
  if(DB.activated&&!DB.user&&!['login','sync','activate'].includes(r))return '#login';
  return null;
}
function render(){
  const red=requireBoot();if(red){if(location.hash!==red){location.replace(red);}return;}
  const {r,p}=route();stopTicker();
  const fns={activate:scActivate,login:scLogin,sync:scSync,home:scHome,minhas:scMinhas,om:scOM,listaoms:scListaOMs,listasss:scListaSSs,
    novaom:scNovaOM,novass:scNovaSS,hisom:scHisOM,hisss:scHisSS,docs:scDocs,qr:scQR,aprov:scAprov};
  const f=fns[r]||scHome;
  document.getElementById('app').innerHTML=f(p);
  const nav=document.getElementById('bnav');
  if(nav){const cls={home:'home',minhas:'minhas',om:'minhas',novaom:'nova',novass:'nova',listaoms:'lista',listasss:'lista',menu:'menu'};
    const btns=nav.querySelectorAll('button');const cur=cls[r]||'';
    btns.forEach(b=>{if(b.dataset.k===cur)b.classList.add('active');});
  }
  if(r==='sync')startSync();if(r==='om'||r==='minhas'&&TIMER)startTicker();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
/* ---------- inicialização ---------- */
function boot(){
  loadDB();restoreTimer();
  if(!location.hash)location.replace('#'+(DB.activated?(DB.user?'home':'login'):'activate'));
  render();
}</script>

function navAtv(i){const o=findOM(route().p.get('n'));if(i<0||i>=o.atvs.length)return;const cur=route().p.get('t');go(`#om?n=${encodeURIComponent(o.num)}&t=${cur}`);}
function setAtv(i,st){const o=findOM(route().p.get('n'));o.atvs[i].st=st;saveDB();render();}
function saveNokPend(i){const o=findOM(route().p.get('n'));const v=document.getElementById('pendNok'+i).value.trim();
  if(!v){toast('Registre a pendência obrigatória do NOK');return;}
  o.pend.push({desc:v,cat:'Decorrente de NOK'});o.atvs[i].st=null;o.atvs[i].nokPend=true;saveDB();toast('Pendência registrada na Carteira');render();}
function saveAtvs(n){const o=findOM(n);if(o.atvs.some(a=>a.st==='NOK'&&!a.nokPend)){toast('Toda atividade NOK exige pendência registrada');return;}
  if(!o.atvs.every(a=>a.st)){toast('Aponte todas as atividades antes de salvar');return;}
  queue({t:'atvs',om:n});toast('Atividades salvas ✓');go('#home');}
function addManualMO(n){const o=findOM(n);const i=new Date(document.getElementById('moIni').value).getTime(),f=new Date(document.getElementById('moFim').value).getTime();
  if(!(f>i)){toast('Data de fim deve ser após o início');return;}
  o.apont.push({mant:document.getElementById('moMant').value,tipo:document.getElementById('moTipo').value,ini:i,fim:f,h:Math.round((f-i)/3600000*100)/100});
  saveDB();queue({t:'mo',om:n});toast('Apontamento salvo ✓');render();}
function addParada(n){const o=findOM(n);const i=document.getElementById('parIni').value.replace('T',' '),f=document.getElementById('parFim').value.replace('T',' ');
  o.paradas.push({ini:i,fim:f,impacto:document.getElementById('parImp').value});saveDB();queue({t:'parada',om:n});toast('Parada registrada ✓');render();}
function addPend(n){const o=findOM(n);const v=document.getElementById('pendDesc').value.trim();if(!v){toast('Descreva a pendência');return;}
  o.pend.push({desc:v,cat:document.getElementById('pendCat').value});saveDB();queue({t:'pend',om:n});toast('Pendência salva na Carteira ✓');render();}
function addDoc(n){const o=findOM(n);const v=document.getElementById('docNome').value.trim();if(!v){toast('Informe o nome do arquivo');return;}
  o.docs.push({nome:v,tipo:'Imagem',tam:'780 KB'});saveDB();queue({t:'doc',om:n});toast('Documento anexado ✓');render();}
function mockAnexo(m){toast(m+' — captura simulada na demo');}
function salvarFechamento(n){const o=findOM(n);o.fecha.servicos=document.getElementById('fechaServ').value.trim();
  if(!o.fecha.servicos){toast('Descreva os serviços executados');return;}
  if(o.tipo==='Corretiva'){o.fecha.falha=document.getElementById('fechaFalha').value;o.fecha.causa=document.getElementById('fechaCausa').value;o.fecha.acao=document.getElementById('fechaAcao').value;}
  o.fecha.salvo=true;saveDB();queue({t:'fecha',om:n});toast('Fechamento salvo ✓');render();}
function concluirOM(n){const o=findOM(n);if(!o.fecha.salvo){toast('Salve o fechamento antes de concluir');return;}
  o.status=o.aprov.length?'Aguardando aprovação':'Concluída';saveDB();queue({t:'concluir',om:n});
  toast(o.aprov.length?'OM enviada para aprovação':'OM concluída — sai do Mobile e vai para Apontamento Concluído no Web ✓');go('#home');}

  return shell('Histórico de SS',`<div class="content">
    <div class="card"><h3>Buscar por ativo</h3>
      <button class="btn outline" style="margin-bottom:12px" onclick="go('#qr?to=hisss')">🔳 Ler QR Code do ativo</button>
      <div class="fld"><label>Ativo</label><select id="hAt2">${DB.ativos.map(a=>`<option value="${a.id}">${a.id} · ${esc(a.nome)}</option>`).join('')}</select></div>
      <button class="btn" onclick="buscaHist('ss')">Buscar</button>
      <p class="note">Funciona apenas com o aplicativo on-line.</p></div>
    <div id="histRes2"></div></div>`);
}
function buscaHist(kind){
  const id=kind==='om'?document.getElementById('hAt').value:document.getElementById('hAt2').value;
  const el=kind==='om'?document.getElementById('histRes'):document.getElementById('histRes2');
  if(!DB.online){toast('Disponível apenas on-line');return;}
  const list=kind==='om'?DB.oms.filter(o=>o.ativo===id):DB.sss.filter(s=>s.ativo===id);
  el.innerHTML=`<h4 class="sec">${list.length} registro(s) para ${id} (ordem crescente de abertura)</h4>`+
    (kind==='om'?list.map(omListItem).join(''):list.map(ssListItem).join(''));
}
/* ---- X. Documentos do ativo ---- */
function scDocs(){
  return shell('Documentos do ativo',`<div class="content">
    <div class="card"><h3>Buscar por ativo</h3>
      <button class="btn outline" style="margin-bottom:12px" onclick="go('#qr?to=docs')">🔳 Ler QR Code do ativo</button>
      <div class="fld"><label>Ativo</label><select id="dAt" onchange="renderDocsAtivo()">${DB.ativos.map(a=>`<option value="${a.id}">${a.id} · ${esc(a.nome)}</option>`).join('')}</select></div></div>
    <div id="docsRes"></div>
    <script>renderDocsAtivo()<\/script></div>`);
}
function renderDocsAtivo(){
  const sel=document.getElementById('dAt');if(!sel)return;const a=ativo(sel.value);
  const el=document.getElementById('docsRes');if(!el)return;
  if(!DB.online){el.innerHTML='<div class="empty">Disponível apenas on-line</div>';return;}
  el.innerHTML=`<div class="card"><h3>📄 Documentos de ${a.id}</h3>${a.docs.map(d=>`<div class="kv"><b>${d.tipo==='PDF'?'📄':d.tipo==='Imagem'?'🖼':'📊'} ${esc(d.nome)}</b><span>${d.tipo} · ${d.tam}</span></div>`).join('')||'<div class="empty">Nenhum documento</div>'}</div>`;
}
/* ---- Leitor QR (simulado) ---- */
function scQR(p){
  const to=p.get('to')||'novaom';
  return shell('Leitor QR Code',`<div class="content" style="text-align:center">
    <div class="qr-box"><div class="qr-line"></div></div>
    <p style="font-size:13px;color:#666;margin-bottom:14px">Aproxime o leitor e fotografe a TAG do ativo.<br><span class="note">Na demo, toque para simular a leitura do QR do ativo.</span></p>
    ${DB.ativos.map(a=>`<div class="list-item" onclick="qrOk('${a.id}','${to}')"><div class="bar" style="background:#F37021"></div><div class="li-main"><div class="li-title">QR · ${a.id}</div><div class="li-sub">${esc(a.nome)}</div></div><span class="li-arrow">›</span></div>`).join('')}</div>`);
}
function qrOk(id,to){
  toast('QR lido: '+id+' — campos preenchidos automaticamente');
  if(to==='hisom'){go('#hisom');setTimeout(()=>{document.getElementById('hAt').value=id;buscaHist('om');},80);}
  else if(to==='hisss'){go('#hisss');setTimeout(()=>{document.getElementById('hAt2').value=id;buscaHist('ss');},80);}
  else if(to==='docs'){go('#docs');setTimeout(()=>{const s=document.getElementById('dAt');if(s){s.value=id;renderDocsAtivo();}},80);}
  else go('#'+to+'?qr=1');
}</script>
